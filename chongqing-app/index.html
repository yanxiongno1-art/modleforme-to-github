<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重庆 App</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #0058BD;
            --text-dark: #191C1E;
            --text-gray: #6B7280;
            --bg-white: #FFFFFF;
            --bg-light: #F2F4F8;
            --border-gray: #E0E3E6;
            --card-bg: #ECF0F3;
            --shadow: rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #FFFFFF 0%, #F7FAFE 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .app-container {
            width: 390px;
            max-height: 844px;
            background: var(--bg-white);
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
        }

        /* Status Bar */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            background: var(--bg-white);
        }

        .status-time {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .status-icons {
            display: flex;
            gap: 5px;
        }

        .status-icons svg {
            width: 18px;
            height: 12px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: var(--bg-white);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
            stroke: var(--text-dark);
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .header-actions {
            display: flex;
            gap: 16px;
        }

        .action-btn {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .action-btn svg {
            width: 24px;
            height: 24px;
            stroke: var(--text-dark);
        }

        /* Search Bar */
        .search-bar {
            padding: 8px 16px;
        }

        .search-input {
            width: 100%;
            height: 40px;
            background: var(--bg-light);
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 8px;
        }

        .search-input svg {
            width: 20px;
            height: 20px;
            stroke: var(--text-gray);
        }

        .search-input span {
            font-size: 14px;
            color: var(--text-gray);
        }

        /* Content Area */
        .content {
            padding: 12px;
            overflow-y: auto;
            max-height: calc(844px - 44px - 56px - 56px - 80px);
        }

        /* Hot Spots Section */
        .section {
            margin-bottom: 12px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 4px;
        }

        .section-icon {
            width: 16px;
            height: 16px;
        }

        .section-icon svg {
            width: 16px;
            height: 13px;
            fill: var(--primary-blue);
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-dark);
        }

        /* Image Grid */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 16px;
            background: var(--bg-white);
            border: 1px solid var(--border-gray);
            border-radius: 8px;
            box-shadow: 0 1px 2px var(--shadow);
        }

        .image-card {
            aspect-ratio: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-gray);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Video Section */
        .video-section {
            background: #F2F5F6;
            border: 1px solid var(--border-gray);
            border-left: none;
            border-right: none;
            border-top: none;
            border-radius: 0;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .video-icon svg {
            width: 16px;
            height: 13px;
            fill: var(--primary-blue);
        }

        .video-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-dark);
        }

        /* Video Cards */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 16px;
            background: var(--bg-white);
            border: 1px solid var(--border-gray);
            border-radius: 8px;
            box-shadow: 0 1px 2px var(--shadow);
        }

        .video-card {
            aspect-ratio: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-gray);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
        }

        .video-play-btn {
            position: absolute;
            width: 26px;
            height: 26px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 3px rgba(0, 0, 0, 0.07), 0 2px 2px rgba(0, 0, 0, 0.06);
        }

        .video-play-btn svg {
            width: 12px;
            height: 12px;
            fill: var(--bg-white);
        }

        /* Bottom Navigation */
        .bottom-nav {
            height: 80px;
            background: var(--bg-white);
            border-top: 1px solid var(--border-gray);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 20px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-item.active .nav-icon svg {
            stroke: var(--primary-blue);
        }

        .nav-item.active .nav-label {
            color: var(--primary-blue);
        }

        .nav-icon {
            width: 24px;
            height: 24px;
        }

        .nav-icon svg {
            width: 24px;
            height: 24px;
            stroke: var(--text-gray);
            stroke-width: 1.5;
        }

        .nav-label {
            font-size: 12px;
            color: var(--text-gray);
        }

        /* Home Indicator */
        .home-indicator {
            width: 134px;
            height: 5px;
            background: var(--text-dark);
            border-radius: 100px;
            margin: 8px auto;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section {
            animation: fadeInUp 0.5s ease forwards;
        }

        .section:nth-child(2) {
            animation-delay: 0.1s;
        }

        .section:nth-child(3) {
            animation-delay: 0.2s;
        }

        .image-card {
            animation: fadeInUp 0.4s ease forwards;
            opacity: 0;
        }

        .image-card:nth-child(1) { animation-delay: 0.3s; }
        .image-card:nth-child(2) { animation-delay: 0.35s; }
        .image-card:nth-child(3) { animation-delay: 0.4s; }

        .video-card {
            animation: fadeInUp 0.4s ease forwards;
            opacity: 0;
        }

        .video-card:nth-child(1) { animation-delay: 0.5s; }
        .video-card:nth-child(2) { animation-delay: 0.55s; }
        .video-card:nth-child(3) { animation-delay: 0.6s; }
    </style>
</head>
